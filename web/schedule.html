<!doctype html>
<html lang="ja" data-base-path="{{.BasePath}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>予定調整 · {{.WorkspaceTitle}}</title><meta name="theme-color" content="#334155"><link rel="icon" href="{{.BasePath}}/favicon.svg" type="image/svg+xml"><link rel="icon" href="{{.BasePath}}/favicon.ico" sizes="any">
<link rel="stylesheet" href="{{.BasePath}}/vendor/bootstrap/bootstrap.min.css"><link rel="stylesheet" href="{{.BasePath}}/css/dads-tokens.css"><link rel="stylesheet" href="{{.BasePath}}/css/dads-components.css"><link rel="stylesheet" href="{{.BasePath}}/css/theme.css"><link rel="stylesheet" href="{{.BasePath}}/css/schedule.css"></head>
<body><header class="schedule-header"><div class="header-brand-wrap"><a href="{{.BasePath}}/" class="brand-link" title="チャット画面へ"><svg aria-hidden="true"><use href="{{.BasePath}}/vendor/bootstrap-icons/bootstrap-icons.svg#chat-square-text"></use></svg>{{.WorkspaceTitle}}</a><span class="header-divider" aria-hidden="true">/</span><span class="header-title">予定調整</span></div><div class="header-actions"><a href="{{.BasePath}}/" class="schedule-back-btn" aria-label="チャットへ戻る" title="チャットへ戻る"><svg class="bi" aria-hidden="true"><use href="{{.BasePath}}/vendor/bootstrap-icons/bootstrap-icons.svg#arrow-left"></use></svg><span>チャットへ戻る</span></a><div class="header-user" title="ログインユーザー"><svg class="bi" aria-hidden="true"><use href="{{.BasePath}}/vendor/bootstrap-icons/bootstrap-icons.svg#person-circle"></use></svg><span id="me"></span></div></div></header>
<main class="schedule-shell">
  <div id="alert" class="alert dads-alert hidden" role="alert"></div>
  <section id="listView" class="hidden"><div class="page-head"><div><a href="{{.BasePath}}/" class="page-back-link"><svg class="bi" aria-hidden="true"><use href="{{.BasePath}}/vendor/bootstrap-icons/bootstrap-icons.svg#arrow-left"></use></svg>チャットに戻る</a><h1>予定調整</h1><p>参加できる日程を、○・△・×で回答できます。</p></div><a id="newSchedule" class="btn btn-primary dads-button dads-button--primary" href="{{.BasePath}}/schedules/new">新しい予定調整</a></div><div class="schedule-periods btn-group mb-3" role="group" aria-label="予定の期間"><button type="button" class="btn btn-outline-secondary dads-button dads-button--secondary" data-period="upcoming" aria-pressed="true">これから・当日</button><button type="button" class="btn btn-outline-secondary dads-button dads-button--secondary" data-period="past" aria-pressed="false">終了した予定</button></div><div id="listError" class="alert alert-danger dads-alert hidden" role="alert"><span id="listErrorText"></span> <button id="retryList" type="button" class="btn btn-outline-secondary dads-button dads-button--secondary">再試行</button></div><div id="scheduleList" class="schedule-list"></div><button id="more" class="btn btn-outline-secondary dads-button dads-button--secondary hidden">さらに読み込む</button></section>
  <section id="editorView" class="hidden"><div class="page-head"><div><h1 id="editorTitle">予定調整を作成</h1><p id="editorHelp">下書き保存後、そのままチャンネルへ公開できます。</p></div><a class="btn btn-outline-secondary dads-button dads-button--secondary" href="{{.BasePath}}/schedules">一覧へ</a></div>
    <form id="scheduleForm" class="panel dads-card">
      <section class="form-section" aria-labelledby="basicHeading">
        <h2 id="basicHeading">基本情報</h2>
        <div class="field"><label for="title" class="dads-label">タイトル <span class="badge-required" aria-hidden="true">必須</span></label><input class="form-control dads-input-text" id="title" maxlength="100" required></div>
        <div class="field"><label for="channel" class="dads-label">公開先チャンネル <span class="badge-required" aria-hidden="true">必須</span></label><select class="form-select dads-select" id="channel" required></select></div>
        <div class="field"><label for="description" class="dads-label">説明 <span class="field-hint">任意</span></label><textarea class="form-control dads-textarea" id="description" maxlength="2000" rows="3"></textarea></div>
      </section>
      <section class="form-section" aria-labelledby="candidateHeading">
        <h2 id="candidateHeading">候補日時 <span class="badge-required" aria-hidden="true">必須・2件以上</span></h2>
        <p id="candidateHelp" class="form-text dads-support-text">時刻を空欄にすると終日候補になります。回答が1件付くと候補日時は変更できません。</p>
        <div id="candidates"></div>
        <button class="btn btn-outline-secondary dads-button dads-button--secondary" id="addCandidate" type="button">＋ 候補を追加</button>
      </section>
      <section class="form-section" aria-labelledby="deadlineHeading">
        <h2 id="deadlineHeading">回答期限</h2>
        <div class="field"><label for="deadline" class="dads-label">締切日時 <span class="field-hint">任意</span></label><input class="form-control dads-input-text" id="deadline" type="datetime-local"></div>
      </section>
      <div class="actions"><button class="btn btn-outline-secondary dads-button dads-button--secondary" id="saveDraft" type="submit">下書き保存</button><button class="btn btn-primary dads-button dads-button--primary hidden" id="publish" type="button">チャンネルに公開</button></div>
    </form>
  </section>
  <section id="detailView" class="hidden"><div class="page-head"><div><div class="status" id="status"></div><h1 id="detailTitle"></h1><p id="detailDescription"></p><div class="meta" id="meta"></div></div><a class="btn btn-outline-secondary dads-button dads-button--secondary" href="{{.BasePath}}/schedules">一覧へ</a></div><div id="finalResult" class="final-result hidden"></div>
    <form id="responseForm" class="panel dads-card"><h2>あなたの回答</h2><div id="responseChoices"></div><div class="field"><label for="comment" class="dads-label">コメント（任意）</label><input class="form-control dads-input-text" id="comment" maxlength="500"></div><div class="actions"><button class="btn btn-primary dads-button dads-button--primary">回答を保存</button></div></form>
    <section id="resultsPanel" class="panel dads-card" aria-labelledby="resultsHeading"><h2 id="resultsHeading">みんなの回答</h2><div class="table-wrap" tabindex="0" role="region" aria-label="みんなの回答一覧"><table class="table dads-table align-middle" id="results"><thead></thead><tbody></tbody></table></div></section>
    <section id="manage" class="panel dads-card hidden"><h2>管理</h2><div class="manage-actions"><button class="btn btn-outline-secondary dads-button dads-button--secondary" id="edit" type="button">内容を編集</button><button class="btn btn-primary dads-button dads-button--primary hidden" id="publishDetail" type="button">チャンネルに公開</button><button class="btn btn-outline-secondary dads-button dads-button--secondary hidden" id="close" type="button">回答を締め切る</button><button class="btn btn-outline-secondary dads-button dads-button--secondary hidden" id="reopen" type="button">回答を再開する</button><button class="btn btn-outline-danger dads-button dads-button--danger hidden" id="withdraw" type="button">予定調整を取り消す</button><button class="btn btn-outline-secondary dads-button dads-button--secondary hidden" id="restore" type="button">取り消しを戻す</button></div><div id="finalizeBox" class="finalize hidden"><label for="finalCandidate" class="dads-label">確定する候補</label><select class="form-select dads-select" id="finalCandidate"></select><button class="btn btn-primary dads-button dads-button--primary" id="finalize" type="button">この日程で確定して投稿</button></div></section>
  </section>
</main><div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div><script src="{{.BasePath}}/js/urls.js"></script><script src="{{.BasePath}}/vendor/bootstrap/bootstrap.bundle.min.js"></script><script src="{{.BasePath}}/js/schedule.js"></script></body></html>
